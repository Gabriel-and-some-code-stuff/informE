# Postgres de desenvolvimento do informE. Sobe com: docker compose up -d
# ponytail: só o banco; o Server roda via `dotnet run` no dev. Empacotar o Server
# em container fica pra sprint de deploy, se precisar.
services:
  postgres:
    image: postgres:16
    container_name: informe-postgres
    environment:
      POSTGRES_USER: informe
      POSTGRES_PASSWORD: informe_dev
      POSTGRES_DB: informe
    ports:
      - "5432:5432"
    volumes:
      # Volume NOMEADO, gerenciado pelo Docker (vive no WSL2, nao no repositorio).
      # Sobrevive a `docker compose down` e a reboot; so `down -v` apaga.
      #
      # Ja foi bind-mount `./database` — o que colocava 1341 arquivos binarios do
      # PGDATA (incluindo postmaster.pid e os hashes de senha do seed) dentro do
      # git. Portabilidade nao dependia disso: o Server aplica as migrations e
      # semeia sozinho no boot (ver DatabaseBootstrapper), entao em maquina nova
      # `start-db.ps1` + `dotnet run` ja entrega o banco completo.
      - informe_pgdata:/var/lib/postgresql/data
    # Healthcheck para o setup-dev.ps1 saber quando o banco aceita conexão.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informe -d informe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  informe_pgdata:
