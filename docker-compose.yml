# docker-compose.yml — variante Alpine (imagens mais leves)
# Era o antigo docker-compose2.yml; virou o padrao. Comparado a variante Debian:
#
#   postgres:16                       ~450 MB  →  postgres:16-alpine            ~115 MB
#   mcr.microsoft.com/dotnet/sdk:10.0 ~900 MB  →  dotnet/sdk:10.0-alpine        ~350 MB
#
# Alpine usa musl libc (nao glibc). .NET 8+ tem suporte solido a Alpine;
# problemas com libs nativas sao raros mas possiveis (ex.: ICU/globalization).
# Se o Server lancar "Couldn't find a valid ICU package", adicione:
#   environment:
#     DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
#
# dns explicito: o resolver musl do Alpine nao usa o DNS interno do Docker
# Desktop por padrao, causando NU1301 (Network unreachable) no dotnet restore.
#
# Para subir: docker compose up

services:
  postgres:
    image: postgres:16-alpine
    container_name: informe-postgres-alpine
    dns: ["8.8.8.8", "1.1.1.1"]
    environment:
      POSTGRES_USER: informe
      POSTGRES_PASSWORD: informe_dev
      POSTGRES_DB: informe
    ports:
      - "5432:5432"
    volumes:
      - informe_pgdata_alpine:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informe -d informe"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    container_name: informe-server-alpine
    dns: ["8.8.8.8", "1.1.1.1"]
    working_dir: /repo
    volumes:
      - .:/repo
      - nuget-cache-alpine:/root/.nuget
    ports:
      - "5020:5020"
    #  - "5021:5021"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5020"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=informe;Username=informe;Password=informe_dev"

    # `dotnet run`, NAO `dotnet watch run`.
    #
    # O watcher do dotnet nao recebe eventos inotify atraves do bind mount
    # Windows -> WSL2 -> container, entao cai no PollingDirectoryWatcher, que
    # varre o /repo inteiro em loop. Esse fallback monta um dicionario indexado
    # por caminho de arquivo, e a enumeracao do mount as vezes devolve a MESMA
    # entrada duas vezes. Quando devolve, o watcher estoura:
    #
    #   Unhandled exception. System.ArgumentException: An item with the same
    #   key has already been added. Key: /repo/src/.../PoliticaDeSenha.cs
    #      at Microsoft.DotNet.Watch.PollingDirectoryWatcher.PollingLoop()
    #
    # A excecao sobe numa thread de background, ninguem captura, e o processo
    # aborta: o container morre com exit 134 (SIGABRT) DEPOIS de ja ter logado
    # "Now listening on: http://0.0.0.0:5020". Ou seja: o Server sobe, atende
    # por alguns minutos e cai sozinho, sem nenhum erro de aplicacao no log.
    # Dai o cliente parar de ser atendido no meio do uso.
    #
    # Hot reload dentro do container nunca funcionou aqui de qualquer forma
    # (sem inotify sobra o polling, que e justamente o que quebra). Quem precisa
    # de hot reload roda o Server no host, onde o watcher usa a API do Windows:
    #   dotnet watch run --project src/Host/informE.Server
    command: dotnet run --project src/Host/informE.Server --launch-profile docker

    # O container so e util enquanto esta atendendo. Se o processo morrer por
    # qualquer motivo, subir de novo e melhor que deixar a porta 5020 muda.
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  informe_pgdata_alpine:
  nuget-cache-alpine:
