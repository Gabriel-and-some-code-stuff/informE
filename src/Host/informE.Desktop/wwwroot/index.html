<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>informE.Desktop</title>
    <base href="/" />
    <!-- Bootstrap REMOVIDO.
         Nenhuma tela do informE usa classe do Bootstrap -- a interface tem o
         proprio sistema de estilo. Mas ele colidia: Bootstrap define
         `.modal { display: none }`, e o modal da tela de Contas usa essa classe.
         O CSS isolado definia posicao e cor sem declarar `display`, entao o
         `display:none` do Bootstrap vencia por ser a unica declaracao daquela
         propriedade. Resultado: clicar em Editar escurecia o fundo e o dialogo
         nao aparecia -- "nao ta funcionando".
         Tirar a folha inteira mata essa familia de conflito de uma vez. -->
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="informE.Desktop.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.informEPickers = {
            show: function (id) {
                const element = document.getElementById(id);
                if (!element) return;

                if (typeof element.showPicker === 'function') {
                    element.showPicker();
                } else {
                    element.focus();
                    element.click();
                }
            }
        };
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // F11 alterna tela cheia.
        //
        // A janela abre em FullScreen (ver App.xaml.cs), e nesse modo NAO ha
        // barra de titulo -- logo, nao ha botao de fechar nem de restaurar.
        // Sem uma saida, a unica opcao seria Alt+F4.
        //
        // O listener vive aqui porque, num BlazorWebView, a tecla chega no
        // conteudo web; a janela nativa nunca a ve.
        document.addEventListener('keydown', function (evento) {
            if (evento.key !== 'F11') return;

            evento.preventDefault();

            // O nome do assembly precisa bater com o do projeto.
            DotNet.invokeMethod('informE.Desktop', 'AlternarTelaCheia');
        });
    </script>

</body>

</html>
